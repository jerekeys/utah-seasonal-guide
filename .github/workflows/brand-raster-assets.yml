name: Build Utah Every Season brand assets
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'assets/brand/**'
      - 'scripts/build-brand-raster.py'
      - '.github/workflows/brand-raster-assets.yml'
permissions:
  contents: write
concurrency:
  group: ues-brand-raster-development
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster dependencies
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build app icons and share cards
        run: python scripts/build-brand-raster.py
      - name: Commit generated brand assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app assets/share
          if git diff --cached --quiet; then
            echo 'Brand raster assets are already current'
            exit 0
          fi
          git commit -m 'Build Utah Every Season raster brand assets'
          git pull --rebase origin development
          git push origin HEAD:development
