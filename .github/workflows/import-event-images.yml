name: Import official event images

on:
  push:
    paths:
      - 'assets/image-import-manifest*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download and optimize event images
        run: |
          python - <<'PY'
          import io, json, pathlib, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from PIL import Image, ImageOps

          UA = 'Mozilla/5.0 (compatible; UtahSeasonalGuide/1.0; editorial image import)'
          manifest_paths = sorted(pathlib.Path('assets').glob('image-import-manifest*.json'))
          items = []
          for manifest_path in manifest_paths:
              batch = json.loads(manifest_path.read_text(encoding='utf-8'))
              items.extend(batch)
              print(f"Loaded {len(batch)} entries from {manifest_path}")
          photos_dir = pathlib.Path('assets/photos')
          photos_dir.mkdir(parents=True, exist_ok=True)

          class MetaImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta':
                      return
                  attrs = {k.lower(): v for k, v in attrs if k and v}
                  key = (attrs.get('property') or attrs.get('name') or '').lower()
                  if key in ('og:image:secure_url', 'og:image', 'twitter:image', 'twitter:image:src'):
                      self.images.append((key, attrs.get('content')))

          def request_bytes(url, accept='image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': accept})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read(), response.geturl()

          def discover_image(page_url):
              raw, final_url = request_bytes(page_url, 'text/html,application/xhtml+xml;q=0.9,*/*;q=0.8')
              parser = MetaImageParser()
              parser.feed(raw.decode('utf-8', errors='ignore'))
              priority = {'og:image:secure_url': 0, 'og:image': 1, 'twitter:image': 2, 'twitter:image:src': 3}
              candidates = sorted((x for x in parser.images if x[1]), key=lambda x: priority.get(x[0], 9))
              if not candidates:
                  raise RuntimeError('No Open Graph/Twitter image found')
              return urljoin(final_url, candidates[0][1])

          successful_ids = set()
          cached_raw = {}
          for item in items:
              try:
                  image_url = item.get('downloadUrl') or discover_image(item['pageUrl'])
                  print(f"Source for {item['id']}: {image_url}")
                  if image_url in cached_raw:
                      raw = cached_raw[image_url]
                  else:
                      raw, _ = request_bytes(image_url)
                      cached_raw[image_url] = raw
                  image = Image.open(io.BytesIO(raw))
                  image = ImageOps.exif_transpose(image)
                  if image.mode not in ('RGB', 'RGBA'):
                      image = image.convert('RGB')
                  if image.mode == 'RGBA':
                      background = Image.new('RGB', image.size, (255,255,255))
                      background.paste(image, mask=image.getchannel('A'))
                      image = background
                  image.thumbnail((1800, 1200), Image.Resampling.LANCZOS)
                  destination = pathlib.Path(item['destination'])
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  image.save(destination, 'WEBP', quality=84, method=6)
                  successful_ids.add(item['id'])
                  print(f"Imported {item['id']} -> {destination} ({image.width}x{image.height})")
              except Exception as exc:
                  print(f"ERROR importing {item['id']}: {type(exc).__name__}: {exc}")

          data_path = pathlib.Path('assets/data.js')
          raw_data = data_path.read_text(encoding='utf-8')
          prefix = 'window.SITE_DATA = '
          if not raw_data.startswith(prefix):
              raise RuntimeError('Unexpected assets/data.js format')
          payload = raw_data[len(prefix):].strip()
          if payload.endswith(';'):
              payload = payload[:-1]
          data = json.loads(payload)
          by_id = {event.get('id'): event for event in data.get('events', [])}
          imported = 0
          for item in items:
              if item['id'] not in successful_ids:
                  continue
              event = by_id.get(item['id'])
              if not event:
                  print(f"WARNING: event id not found: {item['id']}")
                  continue
              event['photo'] = {
                  'src': item['destination'],
                  'alt': item['alt'],
                  'credit': item['credit'],
                  'creditUrl': item['creditUrl'],
                  'sourceUrl': item['sourceUrl'],
                  'usageType': item['usageType'],
                  'rightsNote': item['rightsNote'],
              }
              if item.get('license'):
                  event['photo']['license'] = item['license']
              if item.get('licenseUrl'):
                  event['photo']['licenseUrl'] = item['licenseUrl']
              imported += 1

          local_count = sum(1 for event in data.get('events', []) if event.get('photo') and str(event['photo'].get('src','')).startswith('assets/photos/'))
          data.setdefault('meta', {})['localPhotoListings'] = local_count
          data['meta']['realImageCount'] = local_count
          data['meta']['imagePolicyUpdated'] = 'October 5, 2026'
          data['meta']['imagePolicy'] = 'Official organizer, venue, attraction, tourism and promoter hero/promotional images may be downloaded and hosted locally with source/credit retained; vetted Creative Commons images may also be used; category art remains the fallback.'
          data_path.write_text(prefix + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + ';\n', encoding='utf-8')
          print(f"Updated {imported} event records; {local_count} locally hosted photo listings total")
          PY
      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos assets/data.js
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Import official event hero images"
          git push
