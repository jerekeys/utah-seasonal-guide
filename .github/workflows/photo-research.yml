name: Event photo research
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths: ['scripts/discover-photos.py', '.github/workflows/photo-research.yml']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/discover-photos.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/photo-audit.json
          git commit -m 'Record event source image discovery results' || exit 0
          git pull --rebase origin development
          git push origin HEAD:development
