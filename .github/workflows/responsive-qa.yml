name: Responsive and accessibility review
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'assets/site.js'
      - 'assets/seasonal.css'
      - 'scripts/qa-browser.cjs'
      - '.github/workflows/responsive-qa.yml'
permissions:
  contents: write
jobs:
  browser-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright axe-core
      - run: npx playwright install --with-deps chromium
      - name: Review viewport layouts and interactions
        id: review
        continue-on-error: true
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/guide-server.log 2>&1 &
          node scripts/qa-browser.cjs
      - name: Preserve review evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/qa
          if ! git diff --cached --quiet; then
            git commit -m 'Record responsive preview QA evidence'
            git pull --rebase origin development
            git push origin HEAD:development
          fi
      - name: Report review failures
        if: steps.review.outcome == 'failure'
        run: exit 1
