name: Responsive and accessibility review
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'assets/site.js'
      - 'assets/vibes.js'
      - 'assets/data.js'
      - 'assets/app.js'
      - 'assets/submission.js'
      - 'assets/date-tools.js'
      - 'assets/event-enhancements.js'
      - 'assets/seasonal.css'
      - 'assets/styles.css'
      - 'assets/brand.css'
      - 'assets/brand/**'
      - 'assets/toolkit.css'
      - 'assets/social-campaign.js'
      - 'assets/social-editorial.js'
      - 'assets/social-toolkit.js'
      - 'assets/field-plates.js'
      - 'toolkit/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/build-pages.py'
      - 'scripts/page-templates/**'
      - 'scripts/qa-browser.cjs'
      - 'scripts/qa-app.cjs'
      - 'scripts/qa-social-toolkit.cjs'
      - '.github/workflows/responsive-qa.yml'
concurrency:
  group: seasonal-guide-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright axe-core
      - name: Install browser dependencies
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium webkit
      - name: Review viewport layouts and interactions
        id: review
        continue-on-error: true
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/guide-server.log 2>&1 &
          node scripts/qa-browser.cjs
          node scripts/qa-app.cjs
          node scripts/qa-social-toolkit.cjs
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-accessibility-review-${{ github.run_id }}
          path: research/qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Report review failures
        if: steps.review.outcome == 'failure'
        run: exit 1
