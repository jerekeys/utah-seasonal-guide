<main id="main" tabindex="-1"><div class="page-head"><h1>Contact the guide.</h1><p>Ask about sponsorships, report a website problem or share feedback.</p></div><p>For a new event or a correction to its details, use <a href="/submit/">Suggest an event</a>.</p><form id="contactForm" class="submission-form" name="guide-contact" method="POST" action="/thanks/" data-netlify="true" netlify-honeypot="bot-field"><input type="hidden" name="form-name" value="guide-contact"><p class="sr-only" aria-hidden="true"><label>Leave this field empty<input name="bot-field" tabindex="-1" autocomplete="off"></label></p><div class="field"><label for="contact-topic">What is your message about?</label><select id="contact-topic" name="topic"><option value="feedback">Feedback or a question</option><option value="sponsorship">Sponsored listing inquiry</option><option value="accessibility">Website accessibility</option><option value="privacy">Privacy or removal request</option></select></div><div class="field"><label for="contact-name">Name or organization (optional)</label><input id="contact-name" name="name" maxlength="180" autocomplete="organization"></div><div class="field"><label for="contact-email">Email for a reply (required)</label><input id="contact-email" name="email" type="email" maxlength="250" required autocomplete="email"></div><div class="field"><label for="contact-url">Website or affected page (optional)</label><input id="contact-url" name="url" type="url" placeholder="https://…"></div><div class="field"><label for="contact-message">Message (required)</label><textarea id="contact-message" name="message" required maxlength="3000" placeholder="For sponsorships, include your event or business, target dates, audience and budget."></textarea></div><p>We use your contact details to respond to this inquiry. See our <a href="/privacy/">privacy notice</a>.</p><button class="button primary" type="submit">Send message</button><div class="form-feedback" id="formFeedback" role="status" tabindex="-1" hidden></div></form></main>
